build:
  dockerfile: ./Dockerfile
  context: .
  buildArgs: {}

runtime:
  environmentVariables:
    - name: NODE_ENV
      value: production
    - name: PORT
      value: "8080"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  restartPolicy: always
  healthChecks:
    liveness:
      type: http
      path: /api/auth/me
      initialDelaySeconds: 10
      periodSeconds: 30
      timeoutSeconds: 10
      failureThreshold: 3
    readiness:
      type: http
      path: /api/auth/me
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 2

ports:
  - port: 8080
    protocol: HTTP
    public: true
